services:

  db:
    image: mysql:8.0
    container_name: react-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: react_db
      MYSQL_USER: react_user
      MYSQL_PASSWORD: react123
    ports:
      - "3310:3306"
    volumes:
      - react_mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: react-phpmyadmin
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"

  frontend:
    image: node:20
    container_name: react-frontend
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "5174:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - db

volumes:
  react_mysql_data: